<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FlowTrace">
  <title>FlowTrace</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e88a62"/>
      <stop offset="1" stop-color="#b9532f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- three streamlines through a bend; the middle one carries the tracer -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5">
    <path d="M11 49H33A16 16 0 0 0 49 33V11" opacity=".55"/>
    <path d="M11 37H29A8 8 0 0 0 37 29V22"/>
    <path d="M11 25H23A2 2 0 0 0 25 23V11" opacity=".55"/>
  </g>
  <circle cx="37" cy="13" r="4.5" fill="#fff"/>
</svg>
